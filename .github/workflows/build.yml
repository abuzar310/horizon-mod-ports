name: build

# Builds every mod in mods/ (and the pipeline check in ci/) with cargo-horizon-mod from the exact SDK
# commit its Cargo.toml pins (`[package.metadata.horizon] sdk`), checks the package and runs its
# tests. A tag `<id>-v<version>` publishes mods/<id>'s package as the release asset
# `<id>-<version>.hmod`, the file its registry entry names; a release must build to the [wasm] table
# committed in its horizon-mod.toml.
on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: SDK pins
        id: pins
        run: |
          pins=$(sed -nE 's/^sdk = "([0-9a-f]{40})"$/\1/p' ci/*/Cargo.toml mods/*/Cargo.toml 2>/dev/null | sort -u | tr '\n' ' ')
          echo "pins: $pins"
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s' "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the mod tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: ~/horizon-tools
          key: horizon-mod-tools-v1-${{ steps.pins.outputs.key }}

      - name: Install cargo-horizon-mod for each pin
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          for pin in ${{ steps.pins.outputs.pins }}; do
            [ -x "$HOME/horizon-tools/$pin/bin/cargo-horizon-mod" ] && continue
            src="$RUNNER_TEMP/horizon-$pin"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 https://github.com/horizon-rust/horizon "$pin"
            git -C "$src" checkout -q FETCH_HEAD
            cargo +stable install --locked --root "$HOME/horizon-tools/$pin" --path "$src/crates/cargo-horizon-mod"
            rm -rf "$src"
          done

      - name: Save the mod tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/horizon-tools
          key: horizon-mod-tools-v1-${{ steps.pins.outputs.key }}

      - name: Build, check and test
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in ci/*/ mods/*/; do
            dir=${dir%/}
            [ -f "$dir/horizon-mod.toml" ] || continue
            id=$(sed -nE 's/^id = "([a-z0-9_]+)"$/\1/p' "$dir/horizon-mod.toml" | head -1)
            pin=$(sed -nE 's/^sdk = "([0-9a-f]{40})"$/\1/p' "$dir/Cargo.toml")
            echo "::group::$dir ($id, SDK $pin)"
            (
              cd "$dir"
              export PATH="$HOME/horizon-tools/$pin/bin:$PATH"
              cargo horizon-mod build --wasm
              cargo horizon-mod check "target/horizon-mod/$id.hmod"
              toolchain=$(sed -nE 's/^toolchain = "([^ "]+)[ "].*$/\1/p' horizon-mod.toml)
              cargo "+$toolchain" test
            )
            echo "::endgroup::"
            cp "$dir/target/horizon-mod/$id.hmod" "out/$id.hmod"
            cp "$dir/horizon-mod.toml" "out/$id.horizon-mod.toml"
            {
              echo "### $id ($dir)"
              echo '```'
              echo "sha256 $(sha256sum "out/$id.hmod" | cut -d' ' -f1)  size $(stat -c %s "out/$id.hmod")"
              sed -n '/^\[wasm\]/,$p' "$dir/horizon-mod.toml"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ! git diff --quiet -- "$dir/horizon-mod.toml"; then
              git diff -- "$dir/horizon-mod.toml"
              if [[ "$GITHUB_REF" == refs/tags/* || "$dir" == ci/* ]]; then
                echo "::error title=$id::the build gave another [wasm] table than the committed one"
                exit 1
              fi
              echo "::warning title=$id::the build wrote a new [wasm] table: commit out/$id.horizon-mod.toml before tagging"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "out/$id.hmod"
          grep -qx "version = \"$version\"" "out/$id.horizon-mod.toml"
          cp "out/$id.hmod" "$id-$version.hmod"
          sha=$(sha256sum "$id-$version.hmod" | cut -d' ' -f1)
          gh release create "$TAG" "$id-$version.hmod" --repo "$GITHUB_REPOSITORY" \
            --title "$id $version" --notes "Built by this repository's build workflow from $GITHUB_SHA. SHA-256 $sha"
