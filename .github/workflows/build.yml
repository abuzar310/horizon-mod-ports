name: build

# Builds every mod in mods/ (and the pipeline check in ci/) with cargo-horizon-mod from the exact SDK
# commit its Cargo.toml pins (`[package.metadata.horizon] sdk`), checks the package and runs its
# tests. A tag `<id>-v<version>` publishes mods/<id>'s package as the release asset
# `<id>-<version>.hmod`, the file its registry entry names; a release must build to the [wasm] table
# committed in its horizon-mod.toml.
on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: SDK pins
        id: pins
        run: |
          # The registry checks a submitted package with the tool from its own reviewed engine commit,
          # which can be older than a mod's SDK: install that one too and run its check on every package.
          registry=$(curl -fsSL https://raw.githubusercontent.com/horizon-rust/horizon-mods/main/.github/horizon-rev | tr -d '[:space:]')
          [[ "$registry" =~ ^[0-9a-f]{40}$ ]] || { echo "registry rev unreadable: $registry"; exit 1; }
          pins=$( (sed -nE 's/^sdk = "([0-9a-f]{40})"$/\1/p' ci/*/Cargo.toml mods/*/Cargo.toml 2>/dev/null; echo "$registry") | sort -u | tr '\n' ' ')
          echo "pins: $pins (registry checker: $registry)"
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s' "$pins" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the mod tools
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: ~/horizon-tools
          key: horizon-mod-tools-v1-${{ steps.pins.outputs.key }}
          # A new pin keeps the tools already built for the others.
          restore-keys: horizon-mod-tools-v1-

      - name: Install cargo-horizon-mod for each pin
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          for pin in ${{ steps.pins.outputs.pins }}; do
            [ -x "$HOME/horizon-tools/$pin/bin/cargo-horizon-mod" ] && continue
            src="$RUNNER_TEMP/horizon-$pin"
            git init -q "$src"
            git -C "$src" fetch -q --depth 1 https://github.com/horizon-rust/horizon "$pin"
            git -C "$src" checkout -q FETCH_HEAD
            cargo +stable install --locked --root "$HOME/horizon-tools/$pin" --path "$src/crates/cargo-horizon-mod"
            rm -rf "$src"
          done

      - name: Save the mod tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/horizon-tools
          key: horizon-mod-tools-v1-${{ steps.pins.outputs.key }}

      - name: Build, check and test
        env:
          REGISTRY: ${{ steps.pins.outputs.registry }}
        run: |
          set -uo pipefail
          mkdir -p out
          failed=()
          for dir in ci/*/ mods/*/; do
            dir=${dir%/}
            [ -f "$dir/horizon-mod.toml" ] || continue
            id=$(sed -nE 's/^id = "([a-z0-9_]+)"$/\1/p' "$dir/horizon-mod.toml" | head -1)
            pin=$(sed -nE 's/^sdk = "([0-9a-f]{40})"$/\1/p' "$dir/Cargo.toml")
            echo "::group::$dir ($id, SDK $pin)"
            (
              set -e
              cd "$dir"
              export PATH="$HOME/horizon-tools/$pin/bin:$PATH"
              cargo horizon-mod build --wasm
              cargo horizon-mod check "target/horizon-mod/$id.hmod"
              toolchain=$(sed -nE 's/^toolchain = "([^ "]+)[ "].*$/\1/p' horizon-mod.toml)
              cargo "+$toolchain" test
            ) 2>&1 | tee "out/$id.log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error title=$id::build, check or tests failed (out/$id.log)"
              failed+=("$id")
              continue
            fi
            if ! PATH="$HOME/horizon-tools/$REGISTRY/bin:$PATH" cargo horizon-mod check "$dir/target/horizon-mod/$id.hmod" > "out/$id.registry-check.log" 2>&1; then
              cat "out/$id.registry-check.log"
              echo "::error title=$id::the registry's checker (horizon ${REGISTRY:0:10}) refuses this package (out/$id.registry-check.log)"
              failed+=("$id")
              continue
            fi
            cp "$dir/target/horizon-mod/$id.hmod" "out/$id.hmod"
            cp "$dir/horizon-mod.toml" "out/$id.horizon-mod.toml"
            {
              echo "### $id ($dir)"
              echo '```'
              echo "sha256 $(sha256sum "out/$id.hmod" | cut -d' ' -f1)  size $(stat -c %s "out/$id.hmod")  registry check ${REGISTRY:0:10}: passed"
              sed -n '/^\[wasm\]/,$p' "$dir/horizon-mod.toml"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ! git diff --quiet -- "$dir/horizon-mod.toml"; then
              git diff -- "$dir/horizon-mod.toml"
              if [[ "$GITHUB_REF" == refs/tags/* && "$dir" == mods/* ]]; then
                echo "::error title=$id::a release must build to the [wasm] table committed in its horizon-mod.toml"
                failed+=("$id")
              elif [[ "$dir" == ci/* ]]; then
                # Another machine's build (paths, tool build) need not match the published bytes:
                # the check is that the official source builds and passes the checker here.
                echo "::notice title=$id::built and checked; its [wasm] hash differs from the published build's"
              else
                echo "::warning title=$id::the build wrote a new [wasm] table: commit out/$id.horizon-mod.toml before tagging"
              fi
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed: ${failed[*]}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - name: Publish the package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id="${TAG%-v*}"
          version="${TAG##*-v}"
          test -f "out/$id.hmod"
          grep -qx "version = \"$version\"" "out/$id.horizon-mod.toml"
          cp "out/$id.hmod" "$id-$version.hmod"
          sha=$(sha256sum "$id-$version.hmod" | cut -d' ' -f1)
          gh release create "$TAG" "$id-$version.hmod" --repo "$GITHUB_REPOSITORY" \
            --title "$id $version" --notes "Built by this repository's build workflow from $GITHUB_SHA. SHA-256 $sha"
